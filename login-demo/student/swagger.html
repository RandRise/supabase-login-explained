<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Student Portal · Swagger API Explorer</title>
    <link rel="stylesheet" href="/student/vendor/swagger-ui.css" />
    <link rel="stylesheet" href="/student/swagger.css" />
    <script defer src="/student/vendor/swagger-ui-bundle.js"></script>
    <script type="module" src="/student/swagger.js"></script>
  </head>
  <body>
    <header>
      <a href="/">← Student Portal</a>
      <h1>API explorer</h1>
      <p>Send the same requests yourself. Supabase decides what the token can access.</p>
      <div class="controls">
        <button id="use-session">Use portal session</button
        ><button id="clear-token">Remove bearer token</button
        ><button id="clear-output">Clear responses</button>
      </div>
      <p id="auth-status" role="status">Loading connection…</p>
      <details>
        <summary>Decoded token claims</summary>
        <p>
          Reading these fields does not verify the signature. Supabase verifies the token on each
          request.
        </p>
        <pre id="claims">No token attached.</pre>
      </details>
    </header>
    <div id="swagger-ui"></div>
  </body>
</html>
